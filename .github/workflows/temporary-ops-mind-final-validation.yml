name: Temporary Ops Mind Final Regression Validation

on:
  push:
    branches:
      - fix/ops-mind-voice-layout

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused voice/security/operations tests
        run: python -m pytest -q tests/test_ops_mind_voice.py tests/test_ai_assist_security.py tests/test_k8s_mutation_verification.py
      - name: Full regression suite
        run: python -m pytest -q
