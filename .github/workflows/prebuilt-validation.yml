name: Prebuilt bundle validation

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "*.py"
      - "dialogs_parts/**"
      - "kubernetes_tab_parts/**"
      - "dashboard_tab_parts/**"
      - "main_window_parts/**"
      - "workers_parts/**"
      - "k8s_ai_ops_parts/**"
      - "webapp/**"
      - "assets/**"
      - "requirements*.txt"
      - "installer/build_prebuilt.py"
      - "installer/installer.sh"
      - "installer/installer-win.py"
      - "installer/build_pkg.sh"
      - "tests/test_installer_builder.py"
      - ".github/workflows/prebuilt-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuilt-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate installer scripts and builder tests
        run: |
          bash -n installer/installer.sh
          bash -n installer/build_pkg.sh
          python -m py_compile installer/installer-win.py installer/build_prebuilt.py tests/test_installer_builder.py
          python -m unittest discover -s tests -p "test_installer_builder.py" -v

  build-smoke-test:
    needs: installer-syntax
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            family: linux
            bundle: KubeDock
          - runner: macos-15
            family: macos
            bundle: KubeDock.app
          - runner: macos-15-intel
            family: macos
            bundle: KubeDock.app
          - runner: windows-2025
            family: windows
            bundle: KubeDock
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-voice.txt
            requirements-build.txt

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install macOS build libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install portaudio openssl@3
          PORTAUDIO_PREFIX="$(brew --prefix portaudio)"
          echo "CPPFLAGS=-I$PORTAUDIO_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$PORTAUDIO_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PORTAUDIO_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install application requirements
        shell: bash
        run: |
          # cryptography 50 may build from source on Intel macOS. Link it
          # statically to OpenSSL so PyInstaller cannot substitute an older
          # libssl.3.dylib collected from another dependency.
          if [[ "${RUNNER_OS:-}" == "macOS" && "${RUNNER_ARCH:-}" == "X64" ]]; then
            export OPENSSL_DIR="$(brew --prefix openssl@3)"
            export OPENSSL_STATIC=1
            export PIP_NO_CACHE_DIR=1
            python -m pip cache purge
          fi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-voice.txt -r requirements-build.txt

      - name: Build frozen application
        run: python installer/build_prebuilt.py

      - name: Smoke-test Linux application startup
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout --kill-after=3s 8s dist/KubeDock/KubeDock > /tmp/kubedock-startup.log 2>&1
          result=$?
          cat /tmp/kubedock-startup.log
          if [[ "$result" -ne 124 && "$result" -ne 137 ]]; then
            echo "Frozen KubeDock exited before the startup smoke-test timeout (status $result)"
            exit 1
          fi

      - name: Smoke-test macOS application startup
        if: runner.os == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryFile(mode="w+", encoding="utf-8") as log:
              try:
                  result = subprocess.run(
                      ["dist/KubeDock.app/Contents/MacOS/KubeDock"],
                      stdout=log,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=8,
                      env=os.environ.copy(),
                  )
              except subprocess.TimeoutExpired:
                  log.seek(0)
                  print(log.read())
                  print("Frozen macOS executable remained alive through the startup smoke-test window.")
              else:
                  log.seek(0)
                  print(log.read())
                  print(f"Frozen KubeDock exited early with status {result.returncode}", file=sys.stderr)
                  raise SystemExit(1)
          PY

      - name: Smoke-test Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "dist/KubeDock/KubeDock.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Frozen KubeDock exited during startup with status $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Validate build metadata
        shell: bash
        run: |
          if [[ "${{ matrix.family }}" == "macos" ]]; then
            test -s "dist/${{ matrix.bundle }}/Contents/Resources/KubeDock-BUILD-METADATA.json"
          else
            test -s "dist/${{ matrix.bundle }}/KubeDock-BUILD-METADATA.json"
          fi
