name: Temporary Installer Qwen Validation

on:
  push:
    branches:
      - fix/installers-optional-qwen-tts

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate installer syntax
        run: |
          bash -n installer/installer.sh
          bash -n installer/build_pkg.sh
          python -m py_compile installer/installer-win.py
          echo "Shell and Windows Python installer syntax passed."
      - name: Install core requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Full regression suite
        run: python -m pytest -q
