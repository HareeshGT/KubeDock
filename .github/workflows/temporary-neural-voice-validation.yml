name: Temporary Neural Voice Validation

on:
  push:
    branches:
      - feat/neural-personality-voices

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused neural voice and Ops Mind tests
        run: python -m pytest -q tests/test_ops_mind_voice.py tests/test_ai_assist_security.py tests/test_k8s_mutation_verification.py
      - name: Full test suite
        run: python -m pytest -q
