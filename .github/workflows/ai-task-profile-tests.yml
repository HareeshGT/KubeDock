name: AI Task Profile Tests

on:
  push:
    branches: [main, 'feat/ai-infrastructure-intelligence']
  pull_request:
    branches: [main]

jobs:
  task-profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run task-profile unit tests
        run: python -m unittest discover -s tests -p 'test_ai_task_profiles.py' -v
