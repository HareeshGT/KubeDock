
name: Fast prebuilt installer bundles

on:
  schedule:
    - cron: "0 0 * * *"   # 5:30 AM IST
    - cron: "0 8 * * *"   # 1:30 PM IST
    - cron: "11 15 * * *" # 8:41 PM IST (test)
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Semantic version increment for this deployment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# Publish sequentially so concurrent schedule/manual runs cannot choose the same tag.
concurrency:
  group: fast-installer-versioned-release
  cancel-in-progress: false

jobs:
  prepare-release-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate next semantic version
        id: version
        env:
          VERSION_BUMP: ${{ github.event.inputs.version_bump || 'patch' }}
        run: python installer/release_version.py --bump "$VERSION_BUMP"

  installer-syntax:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate installer syntax and builder flags
        run: |
          bash -n installer/installer.sh
          bash -n installer/build_pkg.sh
          python -m py_compile installer/installer-win.py installer/build_prebuilt.py installer/release_version.py tests/test_installer_builder.py tests/test_release_version.py
          python -m unittest discover -s tests -p "test_installer_builder.py" -v
          python -m unittest discover -s tests -p "test_release_version.py" -v

  build:
    if: github.ref == 'refs/heads/main'
    needs: prepare-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: KubeDock-linux-x86_64.tar.gz
            bundle: KubeDock
            family: linux

          - runner: macos-15
            asset: KubeDock-macos-arm64.tar.gz
            bundle: KubeDock.app
            family: macos

          - runner: macos-15-intel
            asset: KubeDock-macos-x86_64.tar.gz
            bundle: KubeDock.app
            family: macos

          - runner: windows-2025
            asset: KubeDock-windows-x86_64.zip
            bundle: KubeDock
            family: windows

    runs-on: ${{ matrix.runner }}

    env:
      ASSET_NAME: ${{ matrix.asset }}
      BUNDLE_NAME: ${{ matrix.bundle }}
      BUILD_FAMILY: ${{ matrix.family }}
      KUBEDOCK_RELEASE_VERSION: ${{ needs.prepare-release-version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-voice.txt
            requirements-build.txt

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install macOS build libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install portaudio openssl@3
          PORTAUDIO_PREFIX="$(brew --prefix portaudio)"
          echo "CPPFLAGS=-I$PORTAUDIO_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$PORTAUDIO_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PORTAUDIO_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install application requirements
        shell: bash
        run: |
          # cryptography 50 may build from source on Intel macOS. Link it
          # statically to OpenSSL so PyInstaller cannot substitute an older
          # libssl.3.dylib collected from another dependency.
          if [[ "${RUNNER_OS:-}" == "macOS" && "${RUNNER_ARCH:-}" == "X64" ]]; then
            export OPENSSL_DIR="$(brew --prefix openssl@3)"
            export OPENSSL_STATIC=1
            # Avoid reusing a cached wheel built with dynamic OpenSSL.
            export PIP_NO_CACHE_DIR=1
          fi

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-voice.txt -r requirements-build.txt

      - name: Build the app bundle
        run: python installer/build_prebuilt.py

      - name: Smoke-test frozen Linux application startup
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout --kill-after=3s 8s dist/KubeDock/KubeDock > /tmp/kubedock-startup.log 2>&1
          result=$?
          cat /tmp/kubedock-startup.log

          if [[ "$result" -ne 124 && "$result" -ne 137 ]]; then
            echo "Frozen KubeDock exited before the startup smoke-test timeout (status $result)"
            exit 1
          fi

          echo "Frozen Linux executable remained alive under the offscreen Qt platform."

      - name: Smoke-test frozen macOS application startup
        if: runner.os == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryFile(mode="w+", encoding="utf-8") as log:
              try:
                  result = subprocess.run(
                      ["dist/KubeDock.app/Contents/MacOS/KubeDock"],
                      stdout=log,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=8,
                      env=os.environ.copy(),
                  )
              except subprocess.TimeoutExpired:
                  log.seek(0)
                  print(log.read())
                  print("Frozen macOS executable remained alive through the startup smoke-test window.")
              else:
                  log.seek(0)
                  print(log.read())
                  print(
                      f"Frozen KubeDock exited early with status {result.returncode}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
          PY

      - name: Smoke-test frozen Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "dist/KubeDock/KubeDock.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()

          if ($process.HasExited) {
            throw "Frozen KubeDock exited during startup with status $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Frozen Windows executable remained alive through the startup smoke-test window."

      - name: Package Linux/macOS bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "$ASSET_NAME" -C dist "$BUNDLE_NAME"
          test -s "$ASSET_NAME"
          ls -lh "$ASSET_NAME"

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import shutil; shutil.make_archive('KubeDock-windows-x86_64', 'zip', root_dir='dist', base_dir='KubeDock')"

          if (!(Test-Path "$env:ASSET_NAME")) {
            throw "Windows bundle archive was not created"
          }

          Get-Item "$env:ASSET_NAME" | Format-List Name,Length

      - name: Validate bundle metadata
        shell: bash
        run: |
          if [[ "$BUILD_FAMILY" == "macos" ]]; then
            test -f "dist/$BUNDLE_NAME/Contents/Resources/KubeDock-BUILD-METADATA.json"
          else
            test -f "dist/$BUNDLE_NAME/KubeDock-BUILD-METADATA.json"
          fi

      - name: Upload prebuilt bundle
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  publish-versioned-release:
    needs: [prepare-release-version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Check out source for the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          path: release-assets
          merge-multiple: true

      - name: Create bundle checksums and manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare-release-version.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-release-version.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets

          sha256sum KubeDock-* > SHA256SUMS

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          assets = sorted(
              p.name for p in root.glob("KubeDock-*") if p.is_file()
          )

          release_tag = os.environ["RELEASE_TAG"]
          release_version = os.environ["RELEASE_VERSION"]
          manifest = {
              "application": "KubeDock",
              "release_tag": release_tag,
              "release_version": release_version,
              "source_branch": os.environ["SOURCE_BRANCH"],
              "source_sha": os.environ["SOURCE_SHA"],
              "built_at": datetime.now(timezone.utc).isoformat(),
              "assets": assets,
              "sha256_file": "SHA256SUMS",
              "note": "Rolling prebuilt bundles for main. Optional Qwen3-TTS is not included.",
          }

          (root / "KubeDock-fast-installer.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          cat KubeDock-fast-installer.json

      - name: Publish immutable semantic-version release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.prepare-release-version.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-release-version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="KubeDock fast installer v$RELEASE_VERSION. Built from commit $SOURCE_SHA. Choose the bundle for your OS and architecture. Optional Qwen3-TTS/PyTorch and Qt WebEngine are excluded from these lightweight bundles."

          # Each published version is immutable. Never reuse or overwrite a release tag.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: Release $RELEASE_TAG already exists. Refusing to overwrite an immutable version." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "KubeDock v$RELEASE_VERSION" \
            --notes "$NOTES" \
            --latest

          echo "Published KubeDock v$RELEASE_VERSION at tag $RELEASE_TAG"
