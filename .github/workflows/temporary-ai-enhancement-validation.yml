name: Temporary AI Enhancement Validation

on:
  push:
    branches:
      - ai/high-performance-hardening

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run focused AI enhancement tests
        run: python -m pytest -q tests/test_ai_assist_security.py tests/test_k8s_mutation_verification.py
      - name: Run existing test suite
        run: python -m pytest -q
