<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>KubeDock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0c10' stroke='%235ce1c6' stroke-width='1.4'/%3E%3Cg stroke='%235ce1c6' stroke-width='1.6' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='4.2' fill='none'/%3E%3Cline x1='16' y1='4.5' x2='16' y2='9.5'/%3E%3Cline x1='16' y1='22.5' x2='16' y2='27.5'/%3E%3Cline x1='4.5' y1='16' x2='9.5' y2='16'/%3E%3Cline x1='22.5' y1='16' x2='27.5' y2='16'/%3E%3Cline x1='7.8' y1='7.8' x2='11.1' y2='11.1'/%3E%3Cline x1='20.9' y1='20.9' x2='24.2' y2='24.2'/%3E%3Cline x1='24.2' y1='7.8' x2='20.9' y2='11.1'/%3E%3Cline x1='11.1' y1='20.9' x2='7.8' y2='24.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* -- color -- */
    --bg:         #0a0c10;
    --bg-panel:   #12151c;
    --bg-elevated:#171b24;
    --bg-hover:   #1d222c;
    --border:     #232838;
    --border-soft:#1a1e29;
    --text:       #eef0f4;
    --text-dim:   #9aa1b0;
    --text-faint: #5b6172;
    --accent:     #5ce1c6;
    --accent-dim: rgba(92,225,198,0.14);
    --ok:         #3ecf8e;
    --warn:       #f2b84b;
    --err:        #f2506d;
    --muted:      #6b7284;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-dim); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  body.app-locked #app { visibility:hidden; }
  #login-gate { display:none; }
  #login-gate.open { display:flex; }
  #login-panel { width:min(380px,100%); background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:24px; text-align:left; box-shadow:0 18px 50px rgba(0,0,0,.35); }
  #login-panel h2 { margin:0 0 8px; font-size:18px; }
  #login-panel p { color:var(--text-dim); font-size:13px; line-height:1.5; }
  #login-panel label { display:block; margin:16px 0 6px; font-size:12px; color:var(--text-dim); }
  #login-code { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:12px; color:var(--text); font:20px 'IBM Plex Mono',monospace; letter-spacing:5px; text-align:center; }
  #login-submit, #logout-btn { background:var(--accent-dim); border:1px solid rgba(92,225,198,.35); color:var(--accent); border-radius:7px; padding:10px 14px; font-weight:600; }
  #login-submit { width:100%; margin-top:14px; }
  #login-submit:disabled { opacity:.5; }
  #login-error { min-height:18px; color:var(--err)!important; }
  #logout-btn { font-size:12px; padding:6px 9px; margin-left:8px; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 12px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: var(--bg-panel); border-bottom: 1px solid var(--border-soft);
  }
  header h1 {
    font-size: 16px; margin: 0; display: flex; align-items: baseline; gap: 8px;
    font-weight: 600; letter-spacing: 0.01em;
  }
  header h1 .glyph {
    color: var(--accent); font-size: 17px; line-height: 1;
    font-family: 'IBM Plex Mono', monospace;
  }
  .ns-picker { display: flex; align-items: center; gap: 2px; }
  .ns-picker::before {
    content: "ns:"; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; margin-right: 2px;
  }
  header .ns-select {
    background: none; color: var(--accent); border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; padding: 4px 4px; max-width: 30vw;
  }
  #refresh-btn {
    background: none; border: none; color: var(--text-dim); font-size: 17px;
    padding: 4px 6px 4px 10px; line-height: 1;
  }
  #refresh-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #refresh-btn.spinning { animation: none; }
  }

  /* ---------- tabs ---------- */
  nav {
    display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    overflow-x: auto; padding: 0 8px;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 1; background: none; border: none; color: var(--text-dim);
    padding: 11px 10px 10px; font-size: 13px; font-weight: 500;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }

  /* ---------- search ---------- */
  #search-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    padding: 9px 14px;
  }
  #search-bar .glyph {
    color: var(--text-faint); font-size: 13px; font-family: 'IBM Plex Mono', monospace; flex: none;
  }
  #search-input {
    flex: 1; background: none; border: none; color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; min-width: 0;
  }
  #search-input::placeholder { color: var(--text-faint); }
  #search-clear {
    background: none; border: none; color: var(--text-faint); font-size: 15px;
    padding: 2px 4px; display: none; line-height: 1;
  }
  #search-clear.show { display: block; }
  #search-count {
    color: var(--text-faint); font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; flex: none;
  }

  main { flex: 1; overflow-y: auto; padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- rows ---------- */
  .card {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-soft);
    border-left: 3px solid var(--border);
    padding: 13px 16px 13px 13px;
  }
  .card.status-ok    { border-left-color: var(--ok); }
  .card.status-warn  { border-left-color: var(--warn); }
  .card.status-err   { border-left-color: var(--err); }
  .card.status-muted { border-left-color: var(--muted); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-title {
    font-weight: 500; font-size: 14px; word-break: break-all;
    font-family: 'IBM Plex Mono', monospace;
  }
  .card-sub { color: var(--text-faint); font-size: 12px; margin-top: 3px; }

  .badge {
    font-size: 12px; font-weight: 500; white-space: nowrap;
    display: flex; align-items: center; gap: 5px; padding-top: 1px;
  }
  .badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: currentColor;
  }
  .badge.ok    { color: var(--ok); }
  .badge.warn  { color: var(--warn); }
  .badge.err   { color: var(--err); }
  .badge.muted { color: var(--muted); }

  .card-meta {
    display: flex; flex-wrap: wrap; gap: 12px; margin-top: 9px;
    font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
  }
  .card-meta span b { color: var(--text); font-weight: 500; }

  .card-actions { display: flex; gap: 8px; margin-top: 11px; }
  .card-actions button {
    flex: 1; background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font-size: 12.5px; font-weight: 500;
  }
  .card-actions button:active { background: var(--bg-hover); }
  .card-actions button.danger { color: var(--err); border-color: rgba(242,80,109,0.3); }
  .card-actions button.accent { color: var(--accent); border-color: rgba(92,225,198,0.3); }

  .empty, .loading, .error {
    text-align: center; color: var(--text-faint); padding: 60px 24px; font-size: 13.5px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .error { color: var(--err); }

  mark {
    background: var(--accent-dim); color: var(--accent); border-radius: 2px;
    padding: 0 1px; font-weight: 500;
  }

  /* ---------- log / detail sheet ---------- */
  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(5,6,9,0.65); z-index: 50;
    display: none; align-items: flex-end;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: var(--bg-panel); width: 100%; max-height: 82vh;
    border-radius: 14px 14px 0 0; display: flex; flex-direction: column;
    border-top: 1px solid var(--border);
  }
  #modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--border-soft);
  }
  #modal-header h2 {
    font-size: 13.5px; margin: 0; word-break: break-all; padding-right: 10px;
    font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: var(--text-dim);
  }
  #modal-close { background: none; border: none; color: var(--text-dim); font-size: 19px; padding: 2px 4px; }
  #modal-body {
    padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--text-dim);
    background: var(--bg);
  }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(20px); background: var(--bg-elevated);
    border: 1px solid var(--border); color: var(--text); padding: 10px 16px;
    border-radius: 8px; font-size: 13px; opacity: 0; transition: all 0.2s ease;
    z-index: 60; max-width: 90%; text-align: center;
    font-family: 'IBM Plex Mono', monospace;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #login-gate {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: none; align-items: center; justify-content: center; text-align: center;
    padding: 20px; color: var(--text-dim); font-size: 13.5px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #login-gate.open { display: flex; }
</style>
</head>
<body class="app-locked">
<div id="app">
  <header>
    <h1><span class="glyph">⎈</span>KubeDock</h1>
    <div style="display:flex; align-items:center;">
      <div class="ns-picker">
        <select id="ns-select" class="ns-select"><option value="all">all</option></select>
      </div>
      <button id="refresh-btn" title="Refresh">⟳</button>
      <button id="logout-btn" title="Sign out">Sign out</button>
    </div>
  </header>

  <nav id="tabs">
    <button data-tab="pods" class="active">Pods</button>
    <button data-tab="deployments">Deployments</button>
    <button data-tab="services">Services</button>
    <button data-tab="nodes">Nodes</button>
    <button data-tab="events">Events</button>
  </nav>

  <div id="search-bar">
    <span class="glyph">/</span>
    <input id="search-input" type="text" placeholder="filter pods by name…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <span id="search-count"></span>
    <button id="search-clear" title="Clear">✕</button>
  </div>

  <main id="content">
    <div class="loading">loading…</div>
  </main>
</div>

<div id="modal-backdrop">
  <div id="modal">
    <div id="modal-header">
      <h2 id="modal-title"></h2>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>
<div id="login-gate" class="open" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <form id="login-panel">
    <h2 id="login-title">Sign in to KubeDock</h2>
    <p>Enter the current six-digit code from KubeDock → Settings → Web App. Codes rotate every 30 seconds.</p>
    <label for="login-code">One-time password</label>
    <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-describedby="login-error">
    <p id="login-error" role="status" aria-live="polite"></p>
    <button id="login-submit" type="submit">Connect</button>
  </form>
</div>
<script>
const state = { tab: "pods", namespace: "all", queries: { pods: "", deployments: "", services: "", nodes: "", events: "" }, rawData: null };

const SEARCH_FIELDS = {
  pods:        p  => p.name,
  deployments: d  => d.name,
  services:    s  => s.name,
  nodes:       n  => n.name,
  events:      ev => [ev.reason, ev.object, ev.message].filter(Boolean).join(" "),
};

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function filterData(data, tab, query) {
  if (!query) return data;
  const q = query.toLowerCase();
  const getField = SEARCH_FIELDS[tab];
  return data.filter(item => (getField(item) || "").toLowerCase().includes(q));
}

function highlightMatches(query) {
  const q = query.toLowerCase();
  document.querySelectorAll(".card-title").forEach(node => {
    const text = node.textContent;
    const idx = text.toLowerCase().indexOf(q);
    if (idx === -1) return;
    const before = escapeHtml(text.slice(0, idx));
    const match = escapeHtml(text.slice(idx, idx + q.length));
    const after = escapeHtml(text.slice(idx + q.length));
    node.innerHTML = before + "<mark>" + match + "</mark>" + after;
  });
}

function updateSearchCount(shown, total, query) {
  const countEl = document.getElementById("search-count");
  countEl.textContent = query ? (shown + "/" + total) : "";
}

function renderFiltered() {
  const cfg = TAB_CONFIG[state.tab];
  const query = state.queries[state.tab].trim();
  const data = state.rawData || [];
  const filtered = filterData(data, state.tab, query);
  cfg.render(filtered);
  updateSearchCount(filtered.length, data.length, query);
  if (query) highlightMatches(query);
}

function toast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.color = isError ? "var(--err)" : "var(--text)";
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) {
    showLoginGate("Session expired. Sign in with a new OTP.");
    throw new Error("unauthorized");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.detail || ("Request failed (" + res.status + ")"));
  }
  return data;
}

function openModal(title, bodyText) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").textContent = bodyText;
  document.getElementById("modal-backdrop").classList.add("open");
}
document.getElementById("modal-close").onclick = () =>
  document.getElementById("modal-backdrop").classList.remove("open");
document.getElementById("modal-backdrop").onclick = (e) => {
  if (e.target.id === "modal-backdrop") e.target.classList.remove("open");
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function statusBadge(text, kind) {
  return el("span", "badge " + kind, text);
}

// ---------- renderers ----------

function renderPods(pods) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  if (!pods.length) { content.appendChild(el("div", "empty", "No pods in this namespace.")); return; }

  pods.forEach(p => {
    let kind = "muted";
    if (p.phase === "Running") kind = "ok";
    else if (p.phase === "Pending") kind = "warn";
    else if (p.phase === "Failed" || p.phase === "Unknown") kind = "err";

    const card = el("div", "card status-" + kind);
    const top = el("div", "card-top");
    const left = el("div");
    left.appendChild(el("div", "card-title", p.name));
    left.appendChild(el("div", "card-sub", p.namespace + (p.node ? " · " + p.node : "")));
    top.appendChild(left);
    top.appendChild(statusBadge(p.phase || "?", kind));
    card.appendChild(top);

    const meta = el("div", "card-meta");
    meta.appendChild(el("span", null)).innerHTML = "ready <b>" + p.ready + "</b>";
    meta.appendChild(el("span", null)).innerHTML = "restarts <b>" + p.restarts + "</b>";
    card.appendChild(meta);

    const actions = el("div", "card-actions");
    const logsBtn = el("button", null, "Logs");
    logsBtn.onclick = () => showLogs(p.namespace, p.name, p.containers[0]);
    actions.appendChild(logsBtn);

    const delBtn = el("button", "danger", "Delete");
    delBtn.onclick = () => confirmDeletePod(p.namespace, p.name);
    actions.appendChild(delBtn);
    card.appendChild(actions);

    content.appendChild(card);
  });
}

function renderDeployments(deps) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  if (!deps.length) { content.appendChild(el("div", "empty", "No deployments in this namespace.")); return; }

  deps.forEach(d => {
    const healthy = d.ready === d.replicas && d.replicas > 0;
    const kind = healthy ? "ok" : "warn";

    const card = el("div", "card status-" + kind);
    const top = el("div", "card-top");
    const left = el("div");
    left.appendChild(el("div", "card-title", d.name));
    left.appendChild(el("div", "card-sub", d.namespace));
    top.appendChild(left);
    top.appendChild(statusBadge(d.ready + "/" + d.replicas, kind));
    card.appendChild(top);

    const actions = el("div", "card-actions");
    const restartBtn = el("button", "accent", "Restart");
    restartBtn.onclick = () => restartDeployment(d.namespace, d.name);
    actions.appendChild(restartBtn);

    const scaleBtn = el("button", null, "Scale");
    scaleBtn.onclick = () => scaleDeployment(d.namespace, d.name, d.replicas);
    actions.appendChild(scaleBtn);
    card.appendChild(actions);

    content.appendChild(card);
  });
}

function renderServices(services) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  if (!services.length) { content.appendChild(el("div", "empty", "No services in this namespace.")); return; }

  services.forEach(s => {
    const card = el("div", "card status-muted");
    const top = el("div", "card-top");
    const left = el("div");
    left.appendChild(el("div", "card-title", s.name));
    left.appendChild(el("div", "card-sub", s.namespace + " · " + s.clusterIP));
    top.appendChild(left);
    top.appendChild(statusBadge(s.type || "?", "muted"));
    card.appendChild(top);

    if (s.ports && s.ports.length) {
      const meta = el("div", "card-meta");
      meta.appendChild(el("span", null, s.ports.join(", ")));
      card.appendChild(meta);
    }
    content.appendChild(card);
  });
}

function renderNodes(nodes) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  if (!nodes.length) { content.appendChild(el("div", "empty", "No nodes found.")); return; }

  nodes.forEach(n => {
    const kind = n.ready ? "ok" : "err";
    const card = el("div", "card status-" + kind);
    const top = el("div", "card-top");
    const left = el("div");
    left.appendChild(el("div", "card-title", n.name));
    left.appendChild(el("div", "card-sub", n.version || ""));
    top.appendChild(left);
    top.appendChild(statusBadge(n.ready ? "Ready" : "Not ready", kind));
    card.appendChild(top);

    const meta = el("div", "card-meta");
    meta.appendChild(el("span", null)).innerHTML = "cpu <b>" + (n.cpu || "?") + "</b>";
    meta.appendChild(el("span", null)).innerHTML = "mem <b>" + (n.memory || "?") + "</b>";
    card.appendChild(meta);

    content.appendChild(card);
  });
}

function renderEvents(events) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  if (!events.length) { content.appendChild(el("div", "empty", "No recent events.")); return; }

  events.forEach(ev => {
    const kind = ev.type === "Warning" ? "warn" : "muted";
    const card = el("div", "card status-" + kind);
    const top = el("div", "card-top");
    const left = el("div");
    left.appendChild(el("div", "card-title", ev.reason || "Event"));
    left.appendChild(el("div", "card-sub", ev.object + " · " + (ev.namespace || "")));
    top.appendChild(left);
    top.appendChild(statusBadge(ev.type || "?", kind));
    card.appendChild(top);

    card.appendChild(el("div", "card-meta")).appendChild(el("span", null, ev.message || ""));
    content.appendChild(card);
  });
}

// ---------- actions ----------

async function showLogs(namespace, pod, container) {
  openModal(pod, "loading logs…");
  try {
    const q = container ? ("?container=" + encodeURIComponent(container)) : "";
    const data = await api("/api/logs/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(pod) + q);
    document.getElementById("modal-body").textContent = data.logs || "(no output)";
  } catch (e) {
    document.getElementById("modal-body").textContent = "Error: " + e.message;
  }
}

async function confirmDeletePod(namespace, name) {
  if (!confirm("Delete pod \"" + name + "\" in " + namespace + "?\nIts controller will usually recreate it.")) return;
  try {
    await api("/api/pods/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(name) + "/delete", { method: "POST" });
    toast("Pod deleted");
    loadCurrentTab();
  } catch (e) { toast(e.message, true); }
}

async function restartDeployment(namespace, name) {
  if (!confirm("Rolling-restart \"" + name + "\" in " + namespace + "?")) return;
  try {
    await api("/api/deployments/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(name) + "/restart", { method: "POST" });
    toast("Restart triggered");
    loadCurrentTab();
  } catch (e) { toast(e.message, true); }
}

async function scaleDeployment(namespace, name, current) {
  const input = prompt("Scale \"" + name + "\" to how many replicas?", current);
  if (input === null) return;
  const replicas = parseInt(input, 10);
  if (isNaN(replicas) || replicas < 0) { toast("Enter a valid replica count", true); return; }
  try {
    await api("/api/deployments/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(name) + "/scale", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ replicas }),
    });
    toast("Scaled to " + replicas);
    loadCurrentTab();
  } catch (e) { toast(e.message, true); }
}

// ---------- tab loading ----------

const TAB_CONFIG = {
  pods:        { url: "/api/pods",        render: renderPods,        nsAware: true },
  deployments: { url: "/api/deployments", render: renderDeployments, nsAware: true },
  services:    { url: "/api/services",    render: renderServices,    nsAware: true },
  nodes:       { url: "/api/nodes",       render: renderNodes,       nsAware: false },
  events:      { url: "/api/events",      render: renderEvents,      nsAware: true },
};

async function loadCurrentTab() {
  const cfg = TAB_CONFIG[state.tab];
  const btn = document.getElementById("refresh-btn");
  btn.classList.add("spinning");
  const content = document.getElementById("content");
  content.innerHTML = '<div class="loading">loading…</div>';
  document.getElementById("search-count").textContent = "";
  try {
    let url = cfg.url;
    if (cfg.nsAware) url += "?namespace=" + encodeURIComponent(state.namespace);
    const data = await api(url);
    state.rawData = data;
    renderFiltered();
  } catch (e) {
    state.rawData = null;
    content.innerHTML = '';
    content.appendChild(el("div", "error", e.message));
  } finally {
    btn.classList.remove("spinning");
  }
}

async function loadNamespaces() {
  try {
    const namespaces = await api("/api/namespaces");
    const select = document.getElementById("ns-select");
    namespaces.forEach(ns => {
      const opt = document.createElement("option");
      opt.value = ns; opt.textContent = ns;
      select.appendChild(opt);
    });
  } catch (e) { /* non-fatal — "all" still works */ }
}

document.querySelectorAll("#tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.tab = btn.dataset.tab;
    const savedQuery = state.queries[state.tab];
    document.getElementById("search-input").value = savedQuery;
    document.getElementById("search-input").placeholder = "filter " + btn.dataset.tab + " by name…";
    document.getElementById("search-clear").classList.toggle("show", !!savedQuery);
    loadCurrentTab();
  };
});

document.getElementById("ns-select").onchange = (e) => {
  state.namespace = e.target.value;
  loadCurrentTab();
};

document.getElementById("refresh-btn").onclick = loadCurrentTab;

document.getElementById("search-input").oninput = (e) => {
  state.queries[state.tab] = e.target.value;
  document.getElementById("search-clear").classList.toggle("show", !!e.target.value);
  renderFiltered();
};

document.getElementById("search-clear").onclick = () => {
  state.queries[state.tab] = "";
  const input = document.getElementById("search-input");
  input.value = "";
  input.focus();
  document.getElementById("search-clear").classList.remove("show");
  renderFiltered();
};

function showLoginGate(message) {
  document.body.classList.add("app-locked");
  document.getElementById("login-gate").classList.add("open");
  document.getElementById("login-error").textContent = message || "";
  document.getElementById("login-code").value = "";
  document.getElementById("login-code").focus();
}
function hideLoginGate() {
  document.body.classList.remove("app-locked");
  document.getElementById("login-gate").classList.remove("open");
  document.getElementById("login-error").textContent = "";
  loadNamespaces();
  loadCurrentTab();
}
let loginBusy = false;
document.getElementById("login-panel").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (loginBusy) return;
  const input = document.getElementById("login-code");
  const submit = document.getElementById("login-submit");
  const error = document.getElementById("login-error");
  const code = input.value.trim();
  if (!/^\d{6}$/.test(code)) { error.textContent = "Enter a six-digit OTP."; return; }
  loginBusy = true;
  submit.disabled = true;
  submit.textContent = "Verifying…";
  error.textContent = "";
  try {
    const response = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      credentials: "same-origin", cache: "no-store",
      body: JSON.stringify({ code }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) { error.textContent = data.detail || "OTP authentication failed."; input.select(); return; }
    hideLoginGate();
  } catch (_) {
    error.textContent = "Unable to reach the WebApp. Check the connection and retry.";
  } finally {
    loginBusy = false;
    submit.disabled = false;
    submit.textContent = "Connect";
  }
});
document.getElementById("logout-btn").onclick = async () => {
  try { await fetch("/api/logout", { method: "POST", credentials: "same-origin" }); } catch (_) {}
  state.rawData = null;
  showLoginGate("Signed out. Enter a new OTP to continue.");
};
async function checkSession() {
  try {
    await api("/api/session", { cache: "no-store" });
    document.body.classList.remove("app-locked");
    document.getElementById("login-gate").classList.remove("open");
    loadNamespaces();
    loadCurrentTab();
  } catch (_) { showLoginGate(""); }
}
checkSession();
</script>
